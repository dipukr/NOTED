<svg width="910" height="94" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 94" role="img" aria-label="Controller calls the OrderService proxy, which begins a transaction and calls the real OrderService.placeOrder() to save the order and payment; the proxy then commits on success or rolls back on failure and returns to the controller">
