    <text x="235" y="60.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555">begin transaction</text>
    <rect x="350" y="12" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
