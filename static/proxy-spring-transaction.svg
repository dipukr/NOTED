    <text x="445" y="68" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555">save order · save payment</text>
    <rect x="570" y="12" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="665" y="36" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">OrderService Proxy</text>
