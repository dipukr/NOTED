<svg width="440" height="528" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 528" role="img" aria-label="ProductController calls ProductService, which passes through the Logging, Caching, Retry and Transactional decorators to ProductServiceImpl and then ProductDAO and the database">
