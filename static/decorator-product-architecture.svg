    <path d="M220 56 V74" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#dp1-a)"/>
    <path d="M220 122 V140" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#dp1-a)"/>
    <path d="M220 188 V206" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#dp1-a)"/>
