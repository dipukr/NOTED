  <g font-size="19" font-weight="700" fill="#2b2b2b" text-anchor="middle">
    <text x="330" y="174">Content Delivery Networks (CDNs)</text>
    <text x="952" y="174">Online Services and Apps</text>
    <text x="330" y="528">E-commerce Websites</text>
    <text x="952" y="528">Online Gaming Platforms</text>
  </g>

  <g font-size="15" fill="#3a3a3a">
    <text x="62" y="225">CDNs can leverage GeoDNS to direct users to the nearest server, reducing</text>
    <text x="62" y="244">latency and improving the speed of content delivery. This helps high-traffic</text>
    <text x="62" y="263">websites deliver media-rich content, images, and videos faster to end-</text>
    <text x="62" y="282">users.</text>

    <text x="684" y="225">Companies providing online services, such as streaming platforms, VoIP</text>
    <text x="684" y="244">service providers, social media networks, and collaboration tools, can use</text>
    <text x="684" y="263">GeoDNS to enhance the performance and responsiveness of their services</text>
    <text x="684" y="282">for users around the world.</text>

    <text x="62" y="579">E-commerce sites can use GeoDNS to direct users to the nearest server,</text>
    <text x="62" y="598">improving website load times and minimizing latency. That way, it can</text>
    <text x="62" y="617">enhance the overall user experience and potentially increase sales.</text>

    <text x="684" y="579">GeoDNS is valuable for online gaming platforms to reduce latency by</text>
    <text x="684" y="598">directing players to servers located closest to their geographic location,</text>
    <text x="684" y="617">making the gaming experience incredible. It boosts the overall</text>
    <text x="684" y="636">responsiveness of the gaming environment.</text>
  </g>
</svg>
