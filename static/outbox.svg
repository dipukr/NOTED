<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ob" markerWidth="9" markerHeight="9" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="ob-a" markerWidth="9" markerHeight="9" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="ob-g" markerWidth="9" markerHeight="9" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="ob-c" markerWidth="9" markerHeight="9" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#0891b2"/></marker>
    <filter id="ob-sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <style>
    .edge { fill: none; stroke-width: 2; stroke-linecap: round; }
    .chip { fill: #f8fafc; }
    .lbl { font-size: 12.5px; }
    .bt { font-size: 14.5px; font-weight: 700; }
    .bs { font-size: 11px; }
  </style>
  <rect x="0" y="0" width="1040" height="320" fill="#f8fafc" rx="8"/>

  <!-- Order Service -->
  <rect x="24" y="126" width="146" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" filter="url(#ob-sh)"/>
  <text x="97" y="154" text-anchor="middle" class="bt" fill="#1e3a8a">Order Service</text>
  <text x="97" y="172" text-anchor="middle" class="bs" fill="#2563eb">createOrder()</text>

  <!-- transaction boundary -->
  <rect x="205" y="100" width="184" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="297" y="90" text-anchor="middle" class="bs" font-weight="700" fill="#166534" letter-spacing="0.5">ONE LOCAL TRANSACTION</text>

  <!-- orders table (cylinder) -->
  <path d="M221,120 V152 A76,10 0 0 0 373,152 V120 A76,10 0 0 1 221,120 Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.6"/>
  <ellipse cx="297" cy="120" rx="76" ry="10" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/>
  <text x="297" y="143" text-anchor="middle" class="bt" fill="#374151">orders</text>

  <!-- outbox_event table (cylinder, highlighted) -->
  <path d="M221,198 V230 A76,10 0 0 0 373,230 V198 A76,10 0 0 1 221,198 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <ellipse cx="297" cy="198" rx="76" ry="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="297" y="221" text-anchor="middle" class="bt" fill="#92400e">outbox_event</text>

  <!-- Service -> orders -->
  <path class="edge" d="M170,146 C188,134 200,128 219,124" stroke="#475569" marker-end="url(#ob)"/>
  <g><rect class="chip" x="120" y="102" width="80" height="19" rx="5"/><text x="160" y="115" text-anchor="middle" class="lbl" fill="#475569">save order</text></g>

  <!-- Service -> outbox -->
  <path class="edge" d="M170,172 C188,186 200,200 219,204" stroke="#475569" marker-end="url(#ob)"/>
  <g><rect class="chip" x="120" y="196" width="82" height="19" rx="5"/><text x="161" y="209" text-anchor="middle" class="lbl" fill="#475569">save event</text></g>

  <!-- Relay -->
  <rect x="470" y="126" width="158" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8" filter="url(#ob-sh)"/>
  <text x="549" y="154" text-anchor="middle" class="bt" fill="#166534">Relay</text>
  <text x="549" y="172" text-anchor="middle" class="bs" fill="#16a34a">poller / Debezium CDC</text>

  <!-- outbox -> Relay : read unsent -->
  <path class="edge" d="M374,214 C410,204 436,182 468,168" stroke="#d97706" marker-end="url(#ob-a)"/>
  <g><rect class="chip" x="391" y="181" width="78" height="19" rx="5"/><text x="430" y="194" text-anchor="middle" class="lbl" fill="#92400e">read unsent</text></g>

  <!-- Kafka (cylinder) -->
  <path d="M702,128 V190 A58,10 0 0 0 818,190 V128 A58,10 0 0 1 702,128 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8" filter="url(#ob-sh)"/>
  <ellipse cx="760" cy="128" rx="58" ry="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="760" y="160" text-anchor="middle" class="bt" fill="#5b21b6">Kafka</text>
  <text x="760" y="177" text-anchor="middle" class="bs" fill="#7c3aed">broker</text>

  <!-- Relay -> Kafka : publish -->
  <path class="edge" d="M628,158 L699,158" stroke="#16a34a" marker-end="url(#ob-g)"/>
  <g><rect class="chip" x="636" y="132" width="56" height="19" rx="5"/><text x="664" y="145" text-anchor="middle" class="lbl" fill="#166534">publish</text></g>

  <!-- Consumers -->
  <rect x="882" y="126" width="134" height="64" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.8" filter="url(#ob-sh)"/>
  <text x="949" y="154" text-anchor="middle" class="bt" fill="#155e75">Consumers</text>
  <text x="949" y="172" text-anchor="middle" class="bs" fill="#0891b2">inventory, payment…</text>

  <!-- Kafka -> Consumers -->
  <path class="edge" d="M818,158 L880,158" stroke="#0891b2" marker-end="url(#ob-c)"/>
  <g><rect class="chip" x="819" y="132" width="60" height="19" rx="5"/><text x="849" y="145" text-anchor="middle" class="lbl" fill="#155e75">consume</text></g>

  <!-- caption -->
  <text x="520" y="300" text-anchor="middle" class="lbl" fill="#475569">Business row and event commit together &#8212; or neither does. A relay ships the events afterward.</text>
</svg>
