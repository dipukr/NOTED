<svg width="760" height="150" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" role="img" aria-label="In a monolith, Order, Inventory, Payment and Shipping operations run inside one database transaction, so a failure rolls back all database operations">
    <defs><marker id="sg1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker><marker id="sg1-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9A9A9A"/></marker></defs>
    <rect x="10" y="8" width="740" height="132" rx="10" fill="none" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="6 5"/>
    <path d="M180 62 H218" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#sg1-a)"/>
    <path d="M360 62 H398" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#sg1-a)"/>
    <path d="M540 62 H578" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#sg1-a)"/>
    <path d="M650 84 V112 H110 V86" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="miter" marker-end="url(#sg1-l)"/>
    <text x="24" y="28" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#555555" letter-spacing="0.8">SINGLE DATABASE TRANSACTION</text>
    <rect x="40" y="40" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="110" y="64.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Order</text>
    <rect x="220" y="40" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="290" y="64.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Inventory</text>
    <rect x="400" y="40" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="470" y="64.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Payment</text>
    <rect x="580" y="40" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="650" y="64.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Shipping</text>
    <text x="380" y="106" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555" font-style="italic">rollback all database operations</text>
</svg>
