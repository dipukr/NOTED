<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="s2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0" y="0" width="900" height="250" fill="#f8fafc" rx="8"/>

  <!-- Expected -->
  <text x="40" y="40" font-size="13" font-weight="700" fill="#64748b">Our application expects</text>
  <rect x="40" y="56" width="380" height="150" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#s2)"/>
  <text x="230" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">PaymentProcessor</text>
  <line x1="70" y1="108" x2="390" y2="108" stroke="#c4b5fd" stroke-width="1"/>
  <text x="70" y="148" font-size="14" fill="#4c1d95" font-family="Consolas, monospace">pay(double amount)</text>

  <!-- Provided -->
  <text x="480" y="40" font-size="13" font-weight="700" fill="#64748b">Third-party library provides</text>
  <rect x="480" y="56" width="380" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#s2)"/>
  <text x="670" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">PayPalApi</text>
  <line x1="510" y1="108" x2="830" y2="108" stroke="#fcd34d" stroke-width="1"/>
  <text x="510" y="148" font-size="14" fill="#7c4a03" font-family="Consolas, monospace">makePayment(double</text>
  <text x="510" y="170" font-size="14" fill="#7c4a03" font-family="Consolas, monospace">            amountInDollars)</text>

  <!-- mismatch marker -->
  <text x="450" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#dc2626">&#8800;</text>
</svg>
