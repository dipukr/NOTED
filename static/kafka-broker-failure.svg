<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="bf-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <filter id="bf-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0" y="0" width="720" height="250" fill="#f8fafc" rx="8"/>

  <!-- BEFORE -->
  <text x="150" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">Before</text>
  <g filter="url(#bf-shadow)">
    <rect x="40" y="46" width="220" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
    <rect x="40" y="94" width="220" height="40" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="40" y="142" width="220" height="40" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  </g>
  <text x="60" y="71" font-size="12.5" font-weight="700" fill="#166534">B1 &#8212; Leader</text>
  <text x="60" y="119" font-size="12.5" fill="#1e3a8a">B2 &#8212; Replica</text>
  <text x="60" y="167" font-size="12.5" fill="#1e3a8a">B3 &#8212; Replica</text>

  <!-- arrow -->
  <path d="M280,114 L360,114" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#bf-arrow)"/>
  <text x="320" y="104" text-anchor="middle" font-size="11" fill="#dc2626">B1 crashes</text>

  <!-- AFTER -->
  <text x="560" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">After</text>
  <g filter="url(#bf-shadow)">
    <rect x="450" y="46" width="220" height="40" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4"/>
    <rect x="450" y="94" width="220" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
    <rect x="450" y="142" width="220" height="40" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  </g>
  <text x="470" y="71" font-size="12.5" fill="#991b1b">B1 &#8212; down</text>
  <text x="470" y="119" font-size="12.5" font-weight="700" fill="#166534">B2 &#8212; new Leader</text>
  <text x="470" y="167" font-size="12.5" fill="#1e3a8a">B3 &#8212; Replica</text>

  <text x="360" y="222" text-anchor="middle" font-size="11.5" fill="#64748b">An ISR follower is elected leader; clients fetch new metadata and continue &#8212; no committed data lost.</text>
</svg>
