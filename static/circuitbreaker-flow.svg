<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="cb-arrow" markerWidth="9" markerHeight="9" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="cb-arrow-g" markerWidth="9" markerHeight="9" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="cb-arrow-r" markerWidth="9" markerHeight="9" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="cb-arrow-a" markerWidth="9" markerHeight="9" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#d97706"/></marker>
    <filter id="cb-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <style>
    .edge { fill: none; stroke-width: 2; stroke-linecap: round; }
    .chip { fill: #f8fafc; }
    .lbl  { font-size: 12.5px; }
    .node-title { font-size: 19px; font-weight: 700; }
    .node-sub   { font-size: 12.5px; }
  </style>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc" rx="8"/>

  <!-- incoming request -->
  <path class="edge" d="M22,113 L66,113" stroke="#475569" stroke-width="1.8" marker-end="url(#cb-arrow)"/>
  <text x="44" y="103" text-anchor="middle" class="lbl" fill="#475569">request</text>

  <!-- ===== CLOSED ===== -->
  <rect x="70" y="72" width="215" height="82" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#cb-shadow)"/>
  <text x="177" y="103" text-anchor="middle" class="node-title" fill="#166534">CLOSED</text>
  <text x="177" y="124" text-anchor="middle" class="node-sub" fill="#15803d">requests pass through</text>
  <text x="177" y="141" text-anchor="middle" class="node-sub" fill="#15803d">failures are counted</text>

  <!-- ===== OPEN ===== -->
  <rect x="575" y="72" width="215" height="82" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#cb-shadow)"/>
  <text x="682" y="103" text-anchor="middle" class="node-title" fill="#991b1b">OPEN</text>
  <text x="682" y="124" text-anchor="middle" class="node-sub" fill="#b91c1c">calls fail fast</text>
  <text x="682" y="141" text-anchor="middle" class="node-sub" fill="#b91c1c">return fallback</text>

  <!-- ===== HALF-OPEN ===== -->
  <rect x="322" y="312" width="215" height="82" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#cb-shadow)"/>
  <text x="429" y="343" text-anchor="middle" class="node-title" fill="#92400e">HALF-OPEN</text>
  <text x="429" y="364" text-anchor="middle" class="node-sub" fill="#b45309">allow one trial call</text>
  <text x="429" y="381" text-anchor="middle" class="node-sub" fill="#b45309">to test recovery</text>

  <!-- CLOSED self-loop: outcome counted -->
  <path class="edge" d="M122,72 C120,34 234,34 232,70" stroke="#16a34a" stroke-width="1.8" marker-end="url(#cb-arrow-g)"/>
  <g><rect class="chip" x="110" y="16" width="134" height="22" rx="5"/><text x="177" y="31" text-anchor="middle" class="lbl" fill="#166534">success / failure logged</text></g>

  <!-- CLOSED -> OPEN : failures >= threshold (connects node centers) -->
  <path class="edge" d="M285,113 L573,113" stroke="#dc2626" marker-end="url(#cb-arrow-r)"/>
  <g><rect class="chip" x="343" y="84" width="172" height="22" rx="5"/><text x="429" y="99" text-anchor="middle" class="lbl" fill="#991b1b">failures &#8805; threshold</text></g>

  <!-- OPEN -> HALF-OPEN : retry period elapsed -->
  <path class="edge" d="M642,154 C596,238 558,284 510,309" stroke="#d97706" marker-end="url(#cb-arrow-a)"/>
  <g><rect class="chip" x="556" y="224" width="184" height="22" rx="5"/><text x="648" y="239" text-anchor="middle" class="lbl" fill="#92400e">retryTimePeriod elapsed</text></g>

  <!-- HALF-OPEN -> CLOSED : trial succeeds -->
  <path class="edge" d="M360,312 C312,258 258,204 228,156" stroke="#16a34a" marker-end="url(#cb-arrow-g)"/>
  <g><rect class="chip" x="230" y="238" width="120" height="22" rx="5"/><text x="290" y="253" text-anchor="middle" class="lbl" fill="#166534">trial succeeds</text></g>

  <!-- HALF-OPEN -> OPEN : trial fails -->
  <path class="edge" d="M537,342 C664,334 714,250 701,158" stroke="#dc2626" marker-end="url(#cb-arrow-r)"/>
  <g><rect class="chip" x="650" y="332" width="92" height="22" rx="5"/><text x="696" y="347" text-anchor="middle" class="lbl" fill="#991b1b">trial fails</text></g>

  <!-- fail-fast fallback out of OPEN -->
  <path class="edge" d="M790,131 L836,131" stroke="#dc2626" stroke-width="1.8" marker-end="url(#cb-arrow-r)"/>
  <text x="813" y="121" text-anchor="middle" class="lbl" fill="#b91c1c">fallback</text>

  <!-- served response out of CLOSED (down toward caller) -->
  <path class="edge" d="M132,154 L132,200" stroke="#16a34a" stroke-width="1.8" marker-end="url(#cb-arrow-g)"/>
  <g><rect class="chip" x="74" y="202" width="116" height="22" rx="5"/><text x="132" y="217" text-anchor="middle" class="lbl" fill="#166534">live response</text></g>

  <!-- legend -->
  <g class="lbl" fill="#475569">
    <rect x="70" y="432" width="16" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="94" y="444">Closed &#8211; healthy, traffic flows</text>
    <rect x="330" y="432" width="16" height="16" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="354" y="444">Half-open &#8211; probing recovery</text>
    <rect x="610" y="432" width="16" height="16" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="634" y="444">Open &#8211; tripped, failing fast</text>
  </g>
</svg>
