    <path d="M660 66 V104 H410 V68" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#st3-a)"/>
    <path d="M350 66 V158" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#st3-a)"/>
