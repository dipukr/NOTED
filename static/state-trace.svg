<svg width="760" height="220" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="order.pay(): the client calls pay() on Order, which calls pay(this) on CreatedState; CreatedState calls transitionTo(PaidState); future calls use PaidState as the current state">
