    <rect x="295" y="20" width="170" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="380" y="45.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Order</text>
    <rect x="575" y="20" width="170" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="660" y="45.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">CreatedState</text>
    <text x="234" y="36" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555" font-style="italic">1. pay()</text>
    <text x="519" y="36" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555" font-style="italic">2. pay(this)</text>
    <text x="535" y="98" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555" font-style="italic">3. transitionTo(PaidState)</text>
    <rect x="280" y="160" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="380" y="179" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">PaidState</text>
