<svg width="720" height="150" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" role="img" aria-label="Illustrative memory: without Flyweight 500 MB (100,000 objects times 5 KB of duplicated type data); with Flyweight about 2.41 MB (100,000 contexts times 24 B plus 2 shared types times 5 KB)">
    <defs><marker id="fw4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker><marker id="fw4-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9A9A9A"/></marker></defs>
    <text x="20" y="33" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Without Flyweight</text>
    <rect x="190" y="16" width="400" height="24" rx="4" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <rect x="190" y="16" width="400.00" height="24" rx="4" fill="#555555"/>
    <text x="604" y="33" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">500 MB</text>
    <text x="190" y="58" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#555555">100,000 objects × 5 KB duplicated type data</text>
    <text x="20" y="99" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">With Flyweight</text>
    <rect x="190" y="82" width="400" height="24" rx="4" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <rect x="190" y="82" width="3.00" height="24" rx="4" fill="#555555"/>
    <text x="604" y="99" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">~2.41 MB</text>
    <text x="190" y="124" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#555555">100,000 contexts × 24 B + 2 shared types × 5 KB</text>
</svg>
