    <line x1="30" y1="41" x2="350" y2="41" stroke="#222222" stroke-width="1"/>
    <text x="44" y="60" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">+register(ChatUser)</text>
    <text x="44" y="79" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">+broadcast(String, ChatUser)</text>
    <text x="44" y="98" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">+sendPrivate(String, String, ChatUser)</text>
    <rect x="30" y="170" width="320" height="116" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="190" y="191" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">ChatRoom</text>
