    <text x="44" y="220" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">-users: Map&lt;String, ChatUser&gt;</text>
    <text x="44" y="239" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">+register(ChatUser)</text>
    <text x="44" y="258" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">+broadcast(String, ChatUser)</text>
    <text x="44" y="277" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">+sendPrivate(String, String, ChatUser)</text>
    <rect x="460" y="50" width="300" height="154" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="610" y="71" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">ChatUser</text>
