<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="ChatRoom implements ChatMediator (register, broadcast, sendPrivate) and holds a map of users; ChatUser holds a name and a ChatMediator and can join, send, sendPrivate and receive">
    <defs><marker id="md4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker><marker id="md4-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9A9A9A"/></marker></defs>
    <path d="M190 170 V109" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="miter" marker-end="url(#md4-l)"/>
    <path d="M460 80 H352" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#md4-a)"/>
    <path d="M350 196 H458" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#md4-a)"/>
    <rect x="30" y="10" width="320" height="97" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
