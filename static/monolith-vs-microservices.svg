      <circle r="8.2" fill="none" stroke="#fff" stroke-width="3.6" stroke-dasharray="2.6 2.55"/>
      <circle r="2.6" fill="#2b2d47"/>
    </g>
    <g id="node">
      <circle r="29" fill="#2b2d47"/>
