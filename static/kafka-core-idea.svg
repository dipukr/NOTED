<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ci-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <filter id="ci-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0" y="0" width="820" height="250" fill="#f8fafc" rx="8"/>

  <rect x="24" y="96" width="140" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#ci-shadow)"/>
  <text x="94" y="129" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Producer</text>

  <!-- topic with partitions -->
  <rect x="300" y="40" width="230" height="170" rx="10" fill="#0f172a" filter="url(#ci-shadow)"/>
  <text x="415" y="66" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Topic: orders</text>
  <g filter="url(#ci-shadow)">
    <rect x="320" y="80" width="190" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
    <rect x="320" y="122" width="190" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
    <rect x="320" y="164" width="190" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  </g>
  <g font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">
    <text x="415" y="102">Partition 0</text>
    <text x="415" y="144">Partition 1</text>
    <text x="415" y="186">Partition 2</text>
  </g>

  <rect x="660" y="96" width="140" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#ci-shadow)"/>
  <text x="730" y="129" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Consumer</text>

  <path d="M164,124 L296,124" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ci-arrow)"/>
  <text x="230" y="115" text-anchor="middle" font-size="11" fill="#475569">event</text>
  <path d="M530,124 L656,124" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ci-arrow)"/>
  <text x="593" y="115" text-anchor="middle" font-size="11" fill="#475569">read</text>
</svg>
