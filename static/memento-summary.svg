<svg width="760" height="150" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" role="img" aria-label="The Originator owns and saves its state into a Memento; the Caretaker stores the snapshots and restores a snapshot through the Originator">
    <defs><marker id="mm2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker><marker id="mm2-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9A9A9A"/></marker></defs>
    <path d="M215 40 H283" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#mm2-a)"/>
    <path d="M475 40 H543" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#mm2-a)"/>
    <path d="M640 66 V112 H120 V68" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="miter" marker-end="url(#mm2-l)"/>
    <rect x="25" y="14" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="120" y="34" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Originator</text>
    <text x="120" y="50" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">owns state</text>
    <rect x="285" y="14" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="380" y="34" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Memento</text>
    <text x="380" y="50" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">saves state</text>
    <rect x="545" y="14" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="640" y="34" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Caretaker</text>
    <text x="640" y="50" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">stores snapshots</text>
    <text x="380" y="106" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#555555" font-style="italic">restores snapshot through Originator</text>
</svg>
