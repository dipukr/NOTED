<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="oa-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <filter id="oa-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0" y="0" width="820" height="420" fill="#f8fafc" rx="8"/>

  <!-- Order Service -->
  <rect x="330" y="20" width="160" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#oa-shadow)"/>
  <text x="410" y="51" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Order Service</text>

  <path d="M410,72 L410,104" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#oa-arrow)"/>
  <text x="422" y="93" font-size="10.5" fill="#475569">OrderCreated</text>

  <!-- Kafka -->
  <rect x="330" y="106" width="160" height="56" rx="8" fill="#0f172a" filter="url(#oa-shadow)"/>
  <text x="410" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Kafka</text>

  <!-- fan-out -->
  <g>
    <path d="M360,162 L180,210" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#oa-arrow)"/>
    <path d="M410,162 L410,210" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#oa-arrow)"/>
    <path d="M460,162 L640,210" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#oa-arrow)"/>
  </g>

  <!-- services -->
  <g filter="url(#oa-shadow)">
    <rect x="90" y="212" width="180" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="320" y="212" width="180" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="550" y="212" width="180" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  </g>
  <g font-size="13" font-weight="700" fill="#166534" text-anchor="middle">
    <text x="180" y="243">Payment Service</text>
    <text x="410" y="243">Inventory Service</text>
    <text x="640" y="243">Notification Service</text>
  </g>

  <!-- to sinks -->
  <g>
    <path d="M180,264 L180,314" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#oa-arrow)"/>
    <path d="M410,264 L410,314" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#oa-arrow)"/>
    <path d="M640,264 L640,314" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#oa-arrow)"/>
  </g>

  <!-- sinks -->
  <g filter="url(#oa-shadow)">
    <rect x="110" y="316" width="140" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <rect x="340" y="316" width="140" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <rect x="570" y="316" width="140" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">
    <text x="180" y="345">Database</text>
    <text x="410" y="345">Database</text>
    <text x="640" y="345">Email / SMS</text>
  </g>

  <text x="410" y="398" text-anchor="middle" font-size="11.5" fill="#64748b">Loose coupling, async communication, independent scaling, replay and fault tolerance.</text>
</svg>
