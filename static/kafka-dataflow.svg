<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="df-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <filter id="df-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc" rx="8"/>

  <!-- Producer -->
  <rect x="300" y="20" width="160" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#df-shadow)"/>
  <text x="380" y="49" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Producer</text>

  <path d="M380,68 L380,92" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#df-arrow)"/>
  <text x="392" y="84" font-size="10.5" fill="#475569">ProducerRecord</text>

  <!-- Cluster / topic -->
  <rect x="250" y="94" width="260" height="60" rx="8" fill="#0f172a" filter="url(#df-shadow)"/>
  <text x="380" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Kafka Cluster</text>
  <text x="380" y="140" text-anchor="middle" font-size="11.5" fill="#93c5fd" font-family="Consolas, monospace">topic: orders</text>

  <!-- partitions -->
  <g>
    <path d="M330,154 L170,190" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#df-arrow)"/>
    <path d="M380,154 L380,190" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#df-arrow)"/>
    <path d="M430,154 L590,190" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#df-arrow)"/>
  </g>

  <g filter="url(#df-shadow)">
    <rect x="90" y="192" width="150" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="305" y="192" width="150" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="520" y="192" width="150" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <g font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">
    <text x="165" y="218">P0 (leader)</text>
    <text x="380" y="218">P1 (leader)</text>
    <text x="595" y="218">P2 (leader)</text>
  </g>
  <g font-size="10.5" fill="#7c3aed" text-anchor="middle">
    <text x="165" y="238">+ replicas</text>
    <text x="380" y="238">+ replicas</text>
    <text x="595" y="238">+ replicas</text>
  </g>

  <!-- to consumer group -->
  <g>
    <path d="M165,254 L360,300" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#df-arrow)"/>
    <path d="M380,254 L380,300" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#df-arrow)"/>
    <path d="M595,254 L400,300" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#df-arrow)"/>
  </g>

  <!-- consumer group -->
  <rect x="150" y="304" width="460" height="140" rx="12" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="170" y="326" font-size="13" font-weight="700" fill="#166534">Consumer Group</text>

  <g filter="url(#df-shadow)">
    <rect x="180" y="360" width="120" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="320" y="360" width="120" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="460" y="360" width="120" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  </g>
  <g font-size="13" font-weight="700" fill="#166534" text-anchor="middle">
    <text x="240" y="395">C1</text>
    <text x="380" y="395">C2</text>
    <text x="520" y="395">C3</text>
  </g>
</svg>
