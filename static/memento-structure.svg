<svg width="760" height="270" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="The Caretaker (undo and redo stacks) calls the Originator (internal state, save and restore); the Originator creates Mementos (immutable snapshots of saved state), which the Caretaker stores">
    <defs><marker id="mm1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker><marker id="mm1-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9A9A9A"/></marker></defs>
    <path d="M475 60 H287" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#mm1-a)"/>
    <path d="M160 111 V218 H253" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#mm1-a)"/>
    <path d="M600 111 V218 H507" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#mm1-a)"/>
    <rect x="35" y="14" width="250" height="97" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="160" y="35" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Originator</text>
    <line x1="35" y1="45" x2="285" y2="45" stroke="#222222" stroke-width="1"/>
    <text x="49" y="64" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">- internalState</text>
    <text x="49" y="83" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">+ save()</text>
    <text x="49" y="102" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">+ restore(memento)</text>
    <rect x="475" y="14" width="250" height="97" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="600" y="35" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Caretaker</text>
    <line x1="475" y1="45" x2="725" y2="45" stroke="#222222" stroke-width="1"/>
    <text x="489" y="64" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">- undoStack</text>
    <text x="489" y="83" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">- redoStack</text>
    <text x="489" y="102" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">+ undo() / redo()</text>
    <rect x="255" y="170" width="250" height="78" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="380" y="191" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Memento</text>
    <line x1="255" y1="201" x2="505" y2="201" stroke="#222222" stroke-width="1"/>
    <text x="269" y="220" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">- savedState</text>
    <text x="269" y="239" text-anchor="start" font-family="Consolas, 'Source Code Pro', monospace" font-size="11.5" font-weight="400" fill="#222222">immutable snapshot</text>
    <text x="381" y="53" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555" font-style="italic">calls</text>
    <text x="168" y="165" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555" font-style="italic">creates</text>
    <text x="592" y="165" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555" font-style="italic">stores</text>
</svg>
