<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="kd-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <filter id="kd-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0" y="0" width="820" height="300" fill="#f8fafc" rx="8"/>

  <!-- Order Service -->
  <rect x="24" y="118" width="150" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#kd-shadow)"/>
  <text x="99" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Order Service</text>
  <text x="99" y="164" text-anchor="middle" font-size="11" fill="#2563eb">(producer)</text>

  <!-- Kafka topic -->
  <rect x="320" y="112" width="170" height="72" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.5" filter="url(#kd-shadow)"/>
  <text x="405" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Kafka</text>
  <text x="405" y="162" text-anchor="middle" font-size="11.5" fill="#93c5fd" font-family="Consolas, monospace">topic: order-created</text>

  <!-- consumers -->
  <rect x="640" y="30" width="160" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#kd-shadow)"/>
  <text x="720" y="61" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Payment Service</text>

  <rect x="640" y="124" width="160" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#kd-shadow)"/>
  <text x="720" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Inventory Service</text>

  <rect x="640" y="218" width="160" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#kd-shadow)"/>
  <text x="720" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Notification Service</text>

  <!-- producer -> kafka -->
  <path d="M174,148 L316,148" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#kd-arrow)"/>
  <text x="245" y="139" text-anchor="middle" font-size="11" fill="#475569">publish event</text>

  <!-- kafka -> consumers -->
  <path d="M490,140 C560,120 580,70 636,60" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#kd-arrow)"/>
  <path d="M490,150 L636,150" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#kd-arrow)"/>
  <path d="M490,160 C560,180 580,232 636,242" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#kd-arrow)"/>

  <text x="410" y="290" text-anchor="middle" font-size="11.5" fill="#64748b">The producer does not know who consumes the event &#8212; consumers subscribe independently.</text>
</svg>
