<svg width="820" height="76" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 76" role="img" aria-label="Client calls pay() on the dynamic proxy object, which routes to the InvocationHandler; the handler delegates using Method.invoke() and returns the result">
    <defs><marker id="px6-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker><marker id="px6-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9A9A9A"/></marker></defs>
    <path d="M190 39 H214" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#px6-a)"/>
    <path d="M396 39 H420" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#px6-a)"/>
    <path d="M602 39 H626" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#px6-a)"/>
    <rect x="10" y="14" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="100" y="33" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Client</text>
    <text x="100" y="49" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">calls pay()</text>
    <rect x="216" y="14" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="306" y="33" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Dynamic Proxy Object</text>
    <text x="306" y="49" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">generated at runtime</text>
    <rect x="422" y="14" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="512" y="33" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">InvocationHandler</text>
    <text x="512" y="49" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">calls Method.invoke()</text>
    <rect x="628" y="14" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="718" y="33" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Result</text>
    <text x="718" y="49" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">returned to client</text>
</svg>
