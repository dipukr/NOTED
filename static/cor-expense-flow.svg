<svg width="860" height="120" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 120" role="img" aria-label="An expense request goes to the Team Lead, who approves up to 1,000 or forwards to the Manager, who approves up to 10,000 or forwards to the Director, who approves up to 1,00,000 or rejects">
    <defs><marker id="cr1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker><marker id="cr1-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9A9A9A"/></marker></defs>
    <path d="M170 40 H213" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#cr1-a)"/>
    <path d="M385 40 H428" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#cr1-a)"/>
    <path d="M600 40 H643" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#cr1-a)"/>
    <path d="M730 66 V96 H690" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter"/>
    <rect x="0" y="14" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="85" y="42.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Expense request</text>
    <rect x="215" y="14" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="300" y="34" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Team Lead</text>
    <text x="300" y="50" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">≤ ₹1,000 → approve</text>
    <rect x="430" y="14" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="515" y="34" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Manager</text>
    <text x="515" y="50" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">≤ ₹10,000 → approve</text>
    <rect x="645" y="14" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="730" y="34" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Director</text>
    <text x="730" y="50" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">≤ ₹1,00,000 → approve</text>
    <text x="406.5" y="33" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555" font-style="italic">forward</text>
    <text x="621.5" y="33" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555" font-style="italic">forward</text>
    <text x="682" y="100" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555" font-style="italic">otherwise reject</text>
</svg>
