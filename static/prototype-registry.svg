<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="pr-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <filter id="pr-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0" y="0" width="720" height="240" fill="#f8fafc" rx="8"/>

  <!-- Registry -->
  <rect x="24" y="40" width="250" height="160" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#pr-shadow)"/>
  <text x="149" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Prototype Registry</text>
  <line x1="24" y1="78" x2="274" y2="78" stroke="#c4b5fd" stroke-width="1"/>

  <!-- keys -->
  <text x="48" y="112" font-size="13" fill="#4c1d95" font-family="Consolas, monospace">"invoice"</text>
  <text x="48" y="150" font-size="13" fill="#4c1d95" font-family="Consolas, monospace">"report"</text>
  <text x="48" y="188" font-size="13" fill="#4c1d95" font-family="Consolas, monospace">"email"</text>

  <!-- prototypes -->
  <rect x="450" y="88" width="230" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#pr-shadow)"/>
  <text x="565" y="110" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Invoice Prototype</text>

  <rect x="450" y="140" width="230" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#pr-shadow)"/>
  <text x="565" y="162" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Report Prototype</text>

  <rect x="450" y="192" width="230" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#pr-shadow)"/>
  <text x="565" y="214" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Email Prototype</text>

  <!-- mappings key -> prototype -->
  <path d="M274,107 L446,105" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#pr-arrow)"/>
  <path d="M274,145 L446,157" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#pr-arrow)"/>
  <path d="M274,183 L446,209" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#pr-arrow)"/>
</svg>
