    <path d="M42 125 H68" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#st4-a)"/>
    <path d="M250 106 L428 50" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#st4-a)"/>
    <path d="M430 62 L252 118" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#st4-a)"/>
    <path d="M490 66 V182" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#st4-a)"/>
