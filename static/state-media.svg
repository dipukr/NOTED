<svg width="700" height="250" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" aria-label="Media player states: start in Stopped; play() goes to Playing; pause() goes to Paused; play() from Paused resumes Playing; stop() from Playing or Paused returns to Stopped">
