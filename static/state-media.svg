    <rect x="430" y="20" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="520" y="45.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Playing</text>
