<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="pc-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <filter id="pc-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0" y="0" width="320" height="380" fill="#f8fafc" rx="8"/>

  <rect x="80" y="24" width="160" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#pc-shadow)"/>
  <text x="160" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Application</text>

  <rect x="80" y="112" width="160" height="52" rx="8" fill="#0f172a" filter="url(#pc-shadow)"/>
  <text x="160" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Kafka</text>

  <rect x="80" y="200" width="160" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#pc-shadow)"/>
  <text x="160" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">OS Page Cache</text>

  <rect x="80" y="288" width="160" height="52" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5" filter="url(#pc-shadow)"/>
  <text x="160" y="319" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Disk</text>

  <path d="M160,76 L160,108" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#pc-arrow)"/>
  <path d="M160,164 L160,196" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#pc-arrow)"/>
  <path d="M160,252 L160,284" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#pc-arrow)"/>
</svg>
