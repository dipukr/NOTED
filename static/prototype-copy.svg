<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="cp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <filter id="cp-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0" y="0" width="1000" height="210" fill="#f8fafc" rx="8"/>

  <!-- divider -->
  <line x1="500" y1="24" x2="500" y2="186" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ============ Shallow (left) ============ -->
  <text x="250" y="34" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">Shallow Copy &#8212; nested object shared</text>

  <rect x="20" y="58" width="170" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#cp-shadow)"/>
  <text x="105" y="85" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Original Employee</text>

  <rect x="20" y="140" width="170" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#cp-shadow)"/>
  <text x="105" y="167" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Clone Employee</text>

  <rect x="310" y="97" width="150" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#cp-shadow)"/>
  <text x="385" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">Address A</text>
  <text x="385" y="135" text-anchor="middle" font-size="10" fill="#b91c1c">(same object)</text>

  <path d="M190,82 L306,110" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#cp-arrow)"/>
  <path d="M190,162 L306,132" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#cp-arrow)"/>

  <!-- ============ Deep (right) ============ -->
  <text x="760" y="34" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Deep Copy &#8212; independent graphs</text>

  <rect x="540" y="58" width="160" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#cp-shadow)"/>
  <text x="620" y="85" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Employee 1</text>
  <rect x="800" y="58" width="160" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#cp-shadow)"/>
  <text x="880" y="85" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Address A</text>
  <path d="M700,80 L796,80" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#cp-arrow)"/>

  <rect x="540" y="140" width="160" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#cp-shadow)"/>
  <text x="620" y="167" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Employee 2</text>
  <rect x="800" y="140" width="160" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#cp-shadow)"/>
  <text x="880" y="167" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Address B</text>
  <path d="M700,162 L796,162" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#cp-arrow)"/>
</svg>
