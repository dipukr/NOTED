<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ps-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="ps-tri" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L12,6 L1,11 Z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
    </marker>
    <filter id="ps-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="360" height="420" fill="#f8fafc" rx="8"/>

  <!-- Prototype (interface) -->
  <g filter="url(#ps-shadow)">
    <rect x="60" y="20" width="240" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="60" y1="52" x2="300" y2="52" stroke="#c4b5fd" stroke-width="1"/>
  </g>
  <text x="180" y="34" text-anchor="middle" font-size="11" font-style="italic" fill="#7c3aed">&lt;&lt;interface&gt;&gt;</text>
  <text x="180" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Prototype</text>
  <text x="180" y="73" text-anchor="middle" font-size="12.5" fill="#4c1d95" font-family="Consolas, monospace">+ clone()</text>

  <!-- ConcretePrototype -->
  <g filter="url(#ps-shadow)">
    <rect x="60" y="180" width="240" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="60" y1="212" x2="300" y2="212" stroke="#a7f3c4" stroke-width="1"/>
  </g>
  <text x="180" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">ConcretePrototype</text>
  <text x="180" y="233" text-anchor="middle" font-size="12.5" fill="#14532d" font-family="Consolas, monospace">+ clone()</text>

  <!-- Client -->
  <g filter="url(#ps-shadow)">
    <rect x="60" y="340" width="240" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="60" y1="372" x2="300" y2="372" stroke="#bfdbfe" stroke-width="1"/>
  </g>
  <text x="180" y="364" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Client</text>
  <text x="180" y="393" text-anchor="middle" font-size="12.5" fill="#1e3a8a" font-family="Consolas, monospace">prototype.clone()</text>

  <!-- ConcretePrototype --implements--> Prototype -->
  <path d="M180,180 L180,92" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ps-tri)"/>
  <text x="192" y="138" font-size="11" fill="#475569">implements</text>

  <!-- Client --uses--> ConcretePrototype -->
  <path d="M180,340 L180,252" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ps-arrow)"/>
  <text x="192" y="298" font-size="11" fill="#475569">uses</text>
</svg>
