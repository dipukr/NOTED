<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ad-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <filter id="ad-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="980" height="230" fill="#f8fafc" rx="8"/>

  <!-- Our Application boundary (wraps Client, PaymentProcessor, PayPalAdapter) -->
  <rect x="14" y="44" width="716" height="150" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="30" y="66" font-size="13" font-weight="700" fill="#64748b">Our Application</text>

  <!-- Client -->
  <rect x="30" y="92" width="150" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#ad-shadow)"/>
  <text x="105" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Client</text>

  <!-- PaymentProcessor (Target interface) -->
  <rect x="260" y="86" width="190" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#ad-shadow)"/>
  <text x="355" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">PaymentProcessor</text>
  <text x="355" y="133" text-anchor="middle" font-size="11" fill="#7c3aed">&lt;&lt;Target interface&gt;&gt;</text>

  <!-- PayPalAdapter -->
  <rect x="560" y="92" width="160" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#ad-shadow)"/>
  <text x="640" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">PayPalAdapter</text>

  <!-- PayPalApi (Third Party) -->
  <rect x="800" y="86" width="160" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#ad-shadow)"/>
  <text x="880" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">PayPalApi</text>
  <text x="880" y="133" text-anchor="middle" font-size="11" fill="#b45309">(Third Party)</text>

  <!-- Client -> PaymentProcessor : uses -->
  <path d="M180,121 L256,121" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ad-arrow)"/>
  <text x="218" y="112" text-anchor="middle" font-size="11" fill="#475569">uses</text>

  <!-- PayPalAdapter -> PaymentProcessor : implements (arrow left) -->
  <path d="M560,121 L454,121" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ad-arrow)"/>
  <text x="507" y="112" text-anchor="middle" font-size="11" fill="#475569">implements</text>

  <!-- PayPalAdapter -> PayPalApi : delegates (arrow right) -->
  <path d="M720,121 L796,121" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ad-arrow)"/>
  <text x="758" y="112" text-anchor="middle" font-size="11" fill="#475569">delegates</text>
</svg>
