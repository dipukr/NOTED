<svg width="440" height="280" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-label="Client calls processPayment() on MetricsPaymentDecorator, which delegates to LoggingPaymentDecorator, which delegates to DefaultPaymentProcessor">
