    <text x="220" y="43" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">processPayment()</text>
    <rect x="85" y="80" width="270" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="220" y="97" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">MetricsPaymentDecorator</text>
    <text x="220" y="113" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">measures execution time</text>
    <rect x="85" y="150" width="270" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
