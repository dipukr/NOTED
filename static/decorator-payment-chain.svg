    <path d="M220 56 V78" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#dc5-a)"/>
    <path d="M220 126 V148" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#dc5-a)"/>
    <path d="M220 196 V218" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#dc5-a)"/>
