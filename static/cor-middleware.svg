    <rect x="70" y="74" width="280" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="210" y="91" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Logging Handler</text>
    <text x="210" y="107" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">record request information</text>
    <rect x="70" y="138" width="280" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
