    <text x="210" y="171" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">reject invalid credentials</text>
    <rect x="70" y="202" width="280" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="210" y="219" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Authorization Handler</text>
    <text x="210" y="235" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">verify resource access</text>
    <rect x="70" y="266" width="280" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="210" y="283" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Validation Handler</text>
