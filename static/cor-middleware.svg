    <path d="M210 56 V72" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#cr2-a)"/>
    <path d="M210 120 V136" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#cr2-a)"/>
    <path d="M210 184 V200" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#cr2-a)"/>
